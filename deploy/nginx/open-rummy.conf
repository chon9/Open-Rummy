# Open Rummy - nginx site for an AWS Lightsail instance (Ubuntu 24.04).
#
# Installed by deploy/setup-lightsail.sh to /etc/nginx/sites-available/open-rummy.conf with
# "rummy.example.com" replaced by your domain. Only plain HTTP is defined here: running
#   sudo certbot --nginx -d your.domain
# adds the 443 server, the certificate paths and the HTTP->HTTPS redirect to this file.
#
# Layout on the server:
#   /srv/open-rummy/web      built client (packages/client/dist), served directly by nginx
#   /srv/open-rummy/server   server bundle (server.js), run by systemd on 127.0.0.1:3001

# WebSocket upgrade helper. Uniquely named so it cannot collide with other sites' maps.
map $http_upgrade $open_rummy_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream open_rummy_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name rummy.example.com;

    root /srv/open-rummy/web;
    index index.html;

    server_tokens off;

    # ---- Behind a CDN / extra proxy (optional) ---------------------------------------------
    # If a CDN (e.g. CloudFront, Cloudflare) sits in front of nginx, $remote_addr is the CDN edge,
    # and every player would share its address in the server's per-IP limits. Restore the real
    # client address with the realip module first, trusting ONLY the CDN's published ranges:
    #   set_real_ip_from 203.0.113.0/24;      # repeat for each CDN range
    #   real_ip_header X-Forwarded-For;        # Cloudflare: CF-Connecting-IP
    #   real_ip_recursive on;

    # The game sends no uploads; only small WebSocket handshakes and health checks reach us.
    client_max_body_size 16k;

    # ---- Compression ----------------------------------------------------------------------
    # VRM/GLB avatars are 5-15 MB of mostly uncompressed glTF binary; gzip helps noticeably.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml
        application/wasm
        model/gltf-binary
        model/gltf+json;

    # ---- Security headers (inherited by every location that does not use add_header) -------
    # Locations below use `expires` (not add_header) for caching so these stay in effect.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP notes:
    #  - three.js / GLTFLoader decode textures through blob: URLs (img-src, connect-src blob:).
    #  - Vite may inline small assets as data: URLs; workers may be created from blob: URLs.
    #  - connect-src lists ws(s)://$host explicitly for browsers without CSP3 'self' websocket
    #    matching. After certbot enables HTTPS, the wss:// entry is the one in use.
    #  - 'unsafe-inline' for styles only: the UI overlay and gsap set inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' ws://$host wss://$host blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # ---- Static files ------------------------------------------------------------------------
    # Hashed build output from Vite: safe to cache "forever".
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # Bundled VRM avatars: large and rarely changed, but not content-hashed.
    location /avatars/ {
        expires 7d;
        try_files $uri =404;
    }

    # Never serve dotfiles (.env, .git, ...) even if one ends up in the web root by mistake.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Model files anywhere: correct MIME type so gzip and browsers handle them properly.
    # `types {}` is scoped to this location, so other files keep the global mime.types map.
    location ~* \.(?:vrm|vrma|glb)$ {
        types { }
        default_type model/gltf-binary;
        expires 7d;
        try_files $uri =404;
    }

    # The SPA shell must always be revalidated so new deploys are picked up immediately.
    location = /index.html {
        expires -1;
    }

    # ---- Backend -----------------------------------------------------------------------------
    location = /ws {
        proxy_pass http://open_rummy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $open_rummy_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append): the server runs with TRUST_PROXY=1 and keys its per-IP limits
        # (connections, room creation, join attempts) on this value, so it must be the address
        # nginx saw, never a client-supplied list. Behind a CDN, use the realip module first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Games last a while; the server's own ping/pong keeps idle sockets alive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://open_rummy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- SPA fallback ------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
